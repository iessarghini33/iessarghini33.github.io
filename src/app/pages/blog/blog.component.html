<div class="max-w-5xl mx-auto">
  <header class="mb-10">
    <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-4">
      {{ translations.title }}
    </h1>
    <p class="text-xl text-gray-600 dark:text-gray-300">
      {{ translations.subtitle }}
    </p>
  </header>

  <div class="mb-8">
    <div class="flex flex-wrap gap-2">
      <button (click)="filterByTag('all')" [class.bg-blue-600]="selectedTag === 'all'"
        [class.text-white]="selectedTag === 'all'" [class.bg-gray-200]="selectedTag !== 'all'"
        [class.dark:bg-gray-700]="selectedTag !== 'all'" [class.text-gray-800]="selectedTag !== 'all'"
        [class.dark:text-white]="selectedTag !== 'all'" class="px-4 py-2 rounded-full text-sm font-medium transition">
        {{ translations.all }}
      </button>
      @for (tag of uniqueTags; track $index) {
        <button (click)="filterByTag(tag)" [class.bg-blue-600]="selectedTag === tag"
          [class.text-white]="selectedTag === tag" [class.bg-gray-200]="selectedTag !== tag"
          [class.dark:bg-gray-700]="selectedTag !== tag" [class.text-gray-800]="selectedTag !== tag"
          [class.dark:text-white]="selectedTag !== tag" class="px-4 py-2 rounded-full text-sm font-medium transition">
          {{ tag }}
        </button>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for(post of filteredPosts; track $index) {
      <div
        class="bg-white dark:bg-gray-700 rounded-lg overflow-hidden shadow-md transition hover:shadow-lg">
        <a [href]="post.externalUrl" target="_blank" rel="noopener noreferrer" class="block">
          <img [src]="post.imageUrl" [alt]="post.title" class="w-full h-48 object-cover">
          <div class="p-6">
            <div class="flex flex-wrap gap-2 mb-3">
              @for(tag of post.tags; track $index) {
                <span
                  class="px-2 py-1 bg-gray-100 dark:bg-gray-600 text-gray-600 dark:text-gray-300 text-xs rounded-full">
                  {{ tag }}
                </span>
              }
            </div>
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-2">{{ post.title }}</h2>
            <p class="text-gray-600 dark:text-gray-300 mb-4">{{ post.description }}</p>
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-500 dark:text-gray-400">{{ post.date }}</span>
              <span class="text-blue-600 dark:text-blue-400 inline-flex items-center">
                {{ translations.readMore }}
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </span>
            </div>
          </div>
        </a>
      </div>
    }
  </div>
</div>
